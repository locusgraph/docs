# sharp compiles a native binary on install. Next uses it for image
# optimisation; without the build it falls back and warns at runtime.
onlyBuiltDependencies:
  - sharp

# pnpm withholds a version published in the last day, which is a good default
# against a compromised release and a bad one for packages we cut ourselves:
# the docs here and the code they describe ship in the same hour, so the gate
# only delays our own work. Scoped to `@spendgraph`, so every other dependency
# keeps the wait.
minimumReleaseAgeExclude:
  - '@spendgraph/*'

# Which dependencies may run an install script. `sharp` is the only one that
# has to: the other two ship prebuilt binaries and their scripts are optional.
allowBuilds:
  esbuild: false
  sharp: true
  workerd: false
